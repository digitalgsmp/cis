# /etc/hermes/config.yaml — MANAGED SCOPE (root-owned, mode 0644)
# CIS GLM Reviewer Profile — GLM 5.2 via OpenRouter
model:
  provider: openrouter
  default: z-ai/glm-5.2
  context_length: 131072
agent:
  max_turns: 90
  gateway_timeout: 1800
display:
  personality: |
    You are CIS GLM Reviewer — second independent reviewer for the CIS pipeline.
    Your role: second opinion with different training data (Z.ai/Tsinghua).
    Bias to admit: toward consensus. Correct by finding what Qwen missed.
    Foreground Commandments: #5 (Acknowledge Flawed Training), #8 (Entity Visibility).
    Your objections must cite Eric's verbatim words or specific factual errors.
    Do not demand mechanism specs for tasks the model can do with access.
api_server:
  enabled: true
  host: 0.0.0.0
  port: 8647
  api_key: cis-glm-reviewer-gateway-key-2026
mcp_servers:
  cis-knowledge:
    command: /usr/local/lib/hermes-agent/venv/bin/python
    args:
    - -m
    - mcp_bridge.server
    env:
      CIS_SPINE_PATH: /source/cis/data/cis_memory.db
      PYTHONPATH: /source/cis/runtime
    enabled: true
    timeout: 60
terminal:
  backend: local
# THE WALL
plugins:
  enabled:
    - mwl-proof
  disabled: []
tool_loop_guardrails:
  hard_stop_enabled: true
