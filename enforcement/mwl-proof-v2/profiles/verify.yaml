# /etc/hermes/config.yaml — MANAGED SCOPE (root-owned, mode 0644)
# CIS Verify Profile — model config in this file, identity is role-based
model:
  provider: openrouter
  default: z-ai/glm-5.2
  context_length: 131072
  max_tokens: 2000
agent:
  max_turns: 90
  gateway_timeout: 1800
display:
  personality: |
    You are Verify — independent evidence verification gate.
    Your role: verify what was built matches what was spec'd. Trust nothing.
    Bias to admit: toward acceptance. Correct by demanding evidence.
    Foreground Commandments: #3 (Verbatim Recording), #9 (Reality Verification).
    Run evidence commands. Capture raw output. Compare against expected.
    If something doesn't match, flag it. Never accept self-reported claims.
    Review the spec and evidence against [PRE-DISCOVERY RESULTS].
    If implementation contradicts current best practices or research
    found in pre-discovery, flag it as FAIL with evidence.
    Trust nothing. Verify everything against external sources.
    ECONOMY: Say what matters and stop. No restating the question. No "here's what I'll do"
    before doing it. No summarizing what you just said. No filler. If a thought is complete
    in two sentences, two sentences is the right answer. Verbosity wastes tokens and erodes
    clarity. Be direct, be specific, be done.
api_server:
  enabled: true
  host: 0.0.0.0
  port: 8648
  api_key: cis-verifier-gateway-key-2026
platforms:
  api_server:
    extra:
      port: 8648
mcp_servers:
  cis-knowledge:
    command: /usr/local/lib/hermes-agent/venv/bin/python
    args:
    - -m
    - mcp_bridge.server
    env:
      CIS_SPINE_PATH: /workspace/cis/data/cis_memory.db
      PYTHONPATH: /workspace/cis/runtime
    # Disabled 2026-09-04. No pipeline agent has ever used cis-knowledge for
    # retrieval: across all six profiles' message stores the only call to any of
    # its 13 tools was one `cis_adapter_status` by review2, a health check. It
    # also carries cis_dispatch_drafter / _reviewer / _implementer, which give
    # anything holding this toolset the ability to start a pipeline run —
    # BUILD LIST 2.23. Required alongside platform_toolsets, not instead of it:
    # an empty or narrowed toolset list is re-populated downstream by the
    # non-configurable-toolset recovery block in hermes_cli/tools_config.py.
    enabled: false
    timeout: 60
terminal:
  backend: local
hooks_auto_accept: true
approvals:
  mode: "off"
# THE WALL
plugins:
  enabled:
    - mwl-proof
  disabled: []
tool_loop_guardrails:
  hard_stop_enabled: true
# TOOLSET TRIM 2026-09-04. Measured, not guessed: the default api_server
# toolset resolves to 35 tools costing ~13,265 prompt tokens, against a
# 2,193-token skill index — tool schemas are 84% of this profile's 15,923.
# Verify's entire recorded history is `execute_code`, six calls, from its own
# state.db message store. `code_execution` resolves to exactly that one tool.
#
# Not a capability loss in practice: reading a file, listing a directory and
# running an evidence command are all reachable through execute_code, which is
# how Verify already did them. If a future run shows it reaching for something
# else, widen this list — the evidence is in
# /home/worker/.hermes-verify/state.db, `SELECT tool_name FROM messages`.
platform_toolsets:
  api_server:
  - code_execution
