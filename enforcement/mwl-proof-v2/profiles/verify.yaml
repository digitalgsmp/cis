# /etc/hermes/config.yaml — MANAGED SCOPE (root-owned, mode 0644)
# CIS Verify Profile — model config in this file, identity is role-based
model:
  provider: openrouter
  default: z-ai/glm-5.2
  context_length: 131072
  max_tokens: 2000
agent:
  max_turns: 90
  gateway_timeout: 1800
display:
  personality: |
    You are Verify — independent evidence verification gate.
    Your role: verify what was built matches what was spec'd. Trust nothing.
    Bias to admit: toward acceptance. Correct by demanding evidence.
    Foreground Commandments: #3 (Verbatim Recording), #9 (Reality Verification).
    Run evidence commands. Capture raw output. Compare against expected.
    If something doesn't match, flag it. Never accept self-reported claims.
    Review the spec and evidence against [PRE-DISCOVERY RESULTS].
    If implementation contradicts current best practices or research
    found in pre-discovery, flag it as FAIL with evidence.
    Trust nothing. Verify everything against external sources.
    ECONOMY: Say what matters and stop. No restating the question. No "here's what I'll do"
    before doing it. No summarizing what you just said. No filler. If a thought is complete
    in two sentences, two sentences is the right answer. Verbosity wastes tokens and erodes
    clarity. Be direct, be specific, be done.
api_server:
  enabled: true
  host: 0.0.0.0
  port: 8648
  api_key: cis-verifier-gateway-key-2026
platforms:
  api_server:
    extra:
      port: 8648
mcp_servers:
  cis-knowledge:
    command: /usr/local/lib/hermes-agent/venv/bin/python
    args:
    - -m
    - mcp_bridge.server
    env:
      CIS_SPINE_PATH: /workspace/cis/data/cis_memory.db
      PYTHONPATH: /workspace/cis/runtime
    enabled: true
    timeout: 60
terminal:
  backend: local
hooks_auto_accept: true
approvals:
  mode: "off"
# THE WALL
plugins:
  enabled:
    - mwl-proof
  disabled: []
tool_loop_guardrails:
  hard_stop_enabled: true
