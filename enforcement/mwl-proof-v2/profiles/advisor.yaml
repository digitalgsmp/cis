# /etc/hermes/config.yaml — MANAGED SCOPE (root-owned, mode 0644)
# CIS Advisor Profile — model config in this file, identity is role-based.
#
# READ-ONLY BY DESIGN — this is NOT dev mode, do not "restore" it and do not add
# write tools. The role has read-shaped measurement instruments only (the
# cis-knowledge MCP in CIS_MCP_MODE=readonly): read a file, search, query the
# spine, inspect git, compare hashes. It CANNOT write, edit, dispatch, or execute
# — skills.platform_disabled and platform_toolsets: [] hold that wall. The
# instruments fix the false-absence failure observed 2026-09-02, when an advisor
# with no access reported three existing backups as missing. It may now CHECK
# before it asserts; it still may not ACT.
model:
  provider: openrouter
  default: z-ai/glm-5.2
  context_length: 131072
  max_tokens: 1500
agent:
  max_turns: 90
  gateway_timeout: 1800
display:
  personality: |
    You are Advisor — you review the CARD, before it runs.
    A wrong card produces a result that satisfies a wrong EXPECT, and a review
    that checks the result against that EXPECT passes it. You are the check on
    the instruction, not on the work.
    Ask two things of every card: what would this fail to establish, and what
    result would satisfy it while being wrong.
    You have READ-ONLY measurement instruments, not a shell. You may read a file
    inside the CIS repo, search file contents, query the spine (read-only),
    inspect git history, and compare hashes. You may NOT write, edit, dispatch,
    execute, or reach the network. VERIFY a discrepancy before you assert it —
    cite the exact file, query, commit, or hash you checked. If something is
    still not reachable through your instruments, SAY WHAT IS MISSING. Never
    report that it does not exist when you merely could not read it.
    ECONOMY: Say what matters and stop. No restating the question. No summarizing
    what you just said. If a thought is complete in two sentences, two sentences
    is the right answer.
api_server:
  enabled: true
  host: 0.0.0.0
  port: 8649
  api_key: cis-advisor-gateway-key-2026
platforms:
  api_server:
    extra:
      port: 8649
mcp_servers:
  cis-knowledge:
    command: /usr/local/lib/hermes-agent/venv/bin/python
    args:
    - -m
    - mcp_bridge.server
    env:
      CIS_SPINE_PATH: /workspace/cis/data/cis_memory.db
      PYTHONPATH: /workspace/cis/runtime
      CIS_MCP_MODE: readonly
      CIS_REPO_ROOT: /workspace/cis
    # READ-ONLY BY MODE. The bridge also carries three dispatch tools (write
    # surface, queue item 2.23). CIS_MCP_MODE=readonly serves only the
    # read-shaped subset (spine + file + git + hash) and refuses dispatch at the
    # call boundary, so this role can measure without being able to mutate.
    enabled: true
    timeout: 180
terminal:
  backend: local
# THE WALL
plugins:
  enabled:
    - mwl-proof
  disabled: []
tool_loop_guardrails:
  hard_stop_enabled: true
