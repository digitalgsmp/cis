# /etc/hermes/config.yaml — MANAGED SCOPE (root-owned, mode 0644)
# CIS Draft Profile — model config in this file, identity is role-based
model:
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  default: deepseek-v4-pro
  context_length: 131072
  max_tokens: 4000
agent:
  reasoning_effort: xhigh
  max_turns: 90
  gateway_timeout: 1800
display:
  personality: |
    You are Draft — structured proposal writer for the CIS pipeline.
    Your role: draft proposals from Eric's verbatim intentions and source material.
    Bias to admit: toward over-production. Correct by proposing less, not more.
    Foreground Commandments: #2 (Anti-Assumption), #9 (Reality Verification).
    Every proposal cites the intention it advances and source documents.
    Output FINAL_JSON with role, status, summary, recommendation, next_action.
    BEFORE drafting, review the [PRE-DISCOVERY RESULTS] for existing specs,
    prior proposals, and current research. If a prior spec exists for this
    topic, build on it. Do not start from scratch.
    Cite sources by file path or URL.
    ECONOMY: Say what matters and stop. No restating the question. No "here's what I'll do"
    before doing it. No summarizing what you just said. No filler. If a thought is complete
    in two sentences, two sentences is the right answer. Verbosity wastes tokens and erodes
    clarity. Be direct, be specific, be done.
api_server:
  enabled: true
  host: 0.0.0.0
  port: 8645
  api_key: cis-drafter-gateway-key-2026
platforms:
  api_server:
    extra:
      port: 8645
mcp_servers:
  cis-knowledge:
    command: /usr/local/lib/hermes-agent/venv/bin/python
    args:
    - -m
    - mcp_bridge.server
    env:
      CIS_SPINE_PATH: /workspace/cis/data/cis_memory.db
      PYTHONPATH: /workspace/cis/runtime
    # Disabled 2026-09-04. Across all six profiles' message stores the only call
    # to any of cis-knowledge's 13 tools was one `cis_adapter_status` by review2,
    # a health check — never once used for retrieval. It also carries
    # cis_dispatch_drafter / _reviewer / _implementer, so any agent holding it can
    # start a pipeline run (BUILD LIST 2.23). Required alongside
    # platform_toolsets, not instead of it: a narrowed toolset list is
    # re-populated by the recovery block in hermes_cli/tools_config.py.
    enabled: false
    timeout: 60
terminal:
  backend: local
# THE WALL
plugins:
  enabled:
    - mwl-proof
  disabled: []
tool_loop_guardrails:
  hard_stop_enabled: true
# TOOLSET TRIM 2026-09-04. Measured, not guessed. Three pings isolated the cost
# nothing had separated before: tool schemas are 13,265 prompt tokens of a
# 15,923-token profile (84%); the entire 75-skill index is 2,193 (14%). The
# default api_server toolset hands every role 35 tool schemas.
#
# This list is the SMALLEST SET OF TOOLSETS covering what this role has actually
# called. Toolsets are the unit, so a few unused tools ride along.
#   file = read_file, search_files, write_file (4)   terminal = terminal (2)
#   skills = skill_view, skills_list (3)             code_execution = execute_code (1)
#
# Draft's recorded usage: read_file 25, search_files 21, terminal 17, skill_view 2, write_file 1 (66 calls)
# Evidence is moderate — 126 messages. write_file appears once, and it is in `file` anyway.
#
# If a run shows it reaching for something outside this set, widen the list —
# the evidence is per-profile and the query is:
#   sqlite3 /home/worker/.hermes-draft/state.db \
#     "SELECT tool_name, COUNT(*) FROM messages WHERE tool_name IS NOT NULL GROUP BY tool_name;"
platform_toolsets:
  api_server:
  - file
  - terminal
  - skills
