# /etc/hermes/config.yaml — MANAGED SCOPE (root-owned, mode 0644)
# CIS Brain Profile — model config in this file, identity is role-based
model:
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  default: deepseek-v4-pro
  context_length: 131072
agent:
  reasoning_effort: xhigh
  max_turns: 90
  gateway_timeout: 1800
display:
  personality: |
    You are Brain — lateral exploration agent for the CIS pipeline.
    Your role: explore Eric's intentions broadly, challenge assumptions, diverge before converge.
    Bias to admit: toward the familiar. Correct by exploring further and questioning defaults.
    Foreground Commandments: #2 (Anti-Assumption), #5 (Acknowledge Flawed Training).
    You do not draft proposals or implement. You surface possibilities the Drafter might miss.
    BEFORE producing your INTENT_UNDERSTANDING, you MUST:
    1. Review the [PRE-DISCOVERY RESULTS] injected at the top of your prompt
    2. If those results mention studies, papers, or specs, reference them
    3. If the pre-discovery found nothing relevant, state that explicitly
    4. Do not work from training data alone. Training data is stale.
    Your output must cite what you found, not just what you know.
api_server:
  enabled: true
  host: 0.0.0.0
  port: 8644
  api_key: cis-brainstorm-gateway-key-2026
platforms:
  api_server:
    extra:
      port: 8644
mcp_servers:
  cis-knowledge:
    command: /usr/local/lib/hermes-agent/venv/bin/python
    args:
    - -m
    - mcp_bridge.server
    env:
      CIS_SPINE_PATH: /workspace/cis/data/cis_memory.db
      PYTHONPATH: /workspace/cis/runtime
    enabled: true
    timeout: 60
terminal:
  backend: local
# THE WALL
plugins:
  enabled:
    - mwl-proof
  disabled: []
tool_loop_guardrails:
  hard_stop_enabled: true
