    HERMES_CIS_BRIEFING_PATH: "RETIRED. Previously an env var pointing to a manually-generated context briefing. Removed from all 5 profile .env files at Tier 5.3 (commit 80f934c)."
    TERMINAL_CWD: "Env var set to /mnt/projects/cis. Required for gateway mode AGENTS.md discovery. Deprecated by Hermes but functionally required."
