<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS — Live Monitor + Roadmap</title>
<style>
body{margin:0;padding:12px;background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.5}
h1{font-size:18px;margin:0 0 4px}
h2{font-size:13px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px;padding-bottom:3px;border-bottom:1px solid #30363d}
a{color:#58a6ff;text-decoration:none;font-size:11px}
a:hover{text-decoration:underline}
.muted{color:#8b949e;font-size:11px}
.green{color:#3fb950}.red{color:#f85149}.yellow{color:#d29922}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0}
.dot.up{background:#3fb950}.dot.down{background:#f85149}

/* Monitor grid */
.monitor{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px;margin-bottom:12px}
.monitor .card{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:10px 12px}
.monitor .card-title{font-size:10px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.monitor .row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:11px;border-bottom:1px solid rgba(255,255,255,.03)}
.monitor .row:last-child{border-bottom:none}
.monitor .row .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.monitor .row .detail{font-size:9px;color:#8b949e;white-space:nowrap;margin-left:6px}
.monitor .blocker{font-size:9px;color:#f85149;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.monitor .blocker:last-child{border-bottom:none}
.monitor .action{font-size:9px;color:#d29922;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.monitor .action:last-child{border-bottom:none}
.monitor .phase-label{font-size:10px;color:#3fb950;font-weight:600;margin-bottom:4px}
.monitor .phase-next{font-size:9px;color:#8b949e}

/* Roadmap iframe */
.roadmap-frame{border:1px solid #30363d;border-radius:6px;overflow:hidden;background:#020817}
.roadmap-frame iframe{width:100%;height:600px;border:none;display:block}

/* Status bar */
.statusbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.refresh{font-size:9px;color:#8b949e}

/* Top nav */
.nav{display:flex;gap:8px;margin-bottom:12px}
.nav a{font-size:12px;padding:4px 12px;border:1px solid #30363d;border-radius:4px;background:#161b22}
.nav a:hover{background:#1f6feb22;border-color:#1f6feb}
</style>
</head>
<body>

<div class="statusbar">
  <h1>CIS Control Portal — Roadmap</h1>
  <a href="/portal" style="font-size:11px">← Back to Portal</a>
</div>

<div class="nav">
  <a href="/portal">Chat</a>
  <a href="/monitor-test">Monitor Only</a>
  <a href="/ui/roadmap" target="_blank">Full SPA ↗</a>
</div>

<!-- Live Monitor -->
<h2>🔌 Live System Monitor</h2>
<div class="monitor" id="monitor">Loading...</div>
<div class="refresh" id="refresh"></div>

<!-- Full Roadmap -->
<h2>📋 Build Roadmap</h2>
<div class="roadmap-frame">
  <iframe src="/ui/roadmap" title="CIS Roadmap"></iframe>
</div>

<script>
async function load(){
  const grid=document.getElementById('monitor');
  const ref=document.getElementById('refresh');
  try{
    const r=await fetch('/api/portal/monitor');
    const d=await r.json();
    ref.textContent='Updated: '+new Date().toLocaleTimeString();

    let h='';

    // Gateways
    h+='<div class="card"><div class="card-title">Hermes Gateways</div>';
    for(const[id,gw] of Object.entries(d.gateways||{})){
      const up=gw.status==='up';
      h+='<div class="row"><span class="dot '+(up?'up':'down')+'"></span><span class="label">'+esc(gw.label)+'</span><span class="detail">:'+gw.port+' · '+gw.model+' · '+gw.context+'</span></div>';
    }
    h+='</div>';

    // Services
    h+='<div class="card"><div class="card-title">Services</div>';
    for(const[id,svc] of Object.entries(d.services||{})){
      const up=svc.status==='up';
      h+='<div class="row"><span class="dot '+(up?'up':'down')+'"></span><span class="label">'+esc(svc.label)+'</span><span class="detail">:'+svc.port+'</span></div>';
    }
    h+='</div>';

    // Phase
    if(d.phase){
      h+='<div class="card"><div class="card-title">Build Phase</div>';
      h+='<div class="phase-label">'+esc(d.phase.build_phase||'unknown')+'</div>';
      h+='<div class="phase-next">Next: '+esc(d.phase.next_tier||'N/A')+'</div>';
      h+='</div>';
    }

    // Blockers
    if(d.blockers&&d.blockers.length){
      h+='<div class="card"><div class="card-title" style="color:#f85149">Active Blockers</div>';
      d.blockers.forEach(b=>h+='<div class="blocker"><b>'+esc(b.id)+'</b> '+esc(b.description).substring(0,150)+'</div>');
      h+='</div>';
    }

    // Next Actions
    if(d.next_actions&&d.next_actions.length){
      h+='<div class="card"><div class="card-title" style="color:#d29922">Next Actions</div>';
      d.next_actions.forEach(a=>h+='<div class="action"><b>'+esc(a.id)+'</b> '+esc(a.description).substring(0,150)+'</div>');
      h+='</div>';
    }

    grid.innerHTML=h;
  }catch(e){
    grid.innerHTML='<div class="card" style="color:#f85149">Monitor unavailable: '+esc(e.message)+'</div>';
  }
}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
load();
setInterval(load,30000);
</script>
</body>
</html>
