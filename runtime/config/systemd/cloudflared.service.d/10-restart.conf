# CIS Cloudflare Tunnel — automatic restart policy (WB.1, Discovery 43)
#
# Tracked source of truth for the live drop-in installed at:
#   ~/.config/systemd/user/cloudflared.service.d/10-restart.conf
#
# Install / update on the live host:
#   install -D -m 0644 \
#     /mnt/projects/cis/runtime/config/systemd/cloudflared.service.d/10-restart.conf \
#     ~/.config/systemd/user/cloudflared.service.d/10-restart.conf
#   systemctl --user daemon-reload
#
# The base unit is ~/.config/systemd/user/cloudflared.service (user-level,
# WantedBy=default.target). User linger is enabled for uid 1000, so the user
# manager — and therefore this service — starts at boot without an
# interactive login.
#
# NEVER send SIGHUP to this cloudflared build: it terminates the process
# instead of reloading ingress. To apply an ingress change:
#   cloudflared tunnel ingress validate
#   systemctl --user restart cloudflared.service
#
# No secrets belong in this file. Tunnel credentials stay in
# ~/.cloudflared/ and are never tracked.

[Service]
Restart=always
RestartSec=5
