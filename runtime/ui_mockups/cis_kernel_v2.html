<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIS — Kernel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base:#09090c; --bg-surface:#101218; --bg-raised:#161a24;
    --border:#242b3a; --border-hi:#354060;
    --blue:#4a9eff; --green:#3dffa0; --amber:#ffb830; --red:#ff4a6a; --purple:#a855f7; --cyan:#22d3ee;
    --t1:#e8eaf2; --t2:#c8cede; --t3:#7a8299;
    --mono:'Share Tech Mono',monospace;
    --sans:'Barlow',sans-serif;
    --cond:'Barlow Condensed',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-base);color:var(--t1);font-family:var(--sans);height:100vh;overflow:hidden;display:flex;flex-direction:column}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .topbar{height:44px;background:var(--bg-surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
  .tb-logo{font-family:var(--cond);font-weight:800;font-size:14px;letter-spacing:.3em;color:var(--blue);text-transform:uppercase;padding-right:14px;border-right:1px solid var(--border)}
  .tb-nav{display:flex;gap:2px;flex:1}
  .tb-nav button{background:0;border:0;cursor:pointer;font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);padding:4px 12px;border-radius:4px;transition:all .12s}
  .tb-nav button:hover{color:var(--t2);background:var(--bg-raised)}
  .tb-nav button.active{color:var(--blue);background:rgba(74,158,255,.08)}
  .tb-right{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--border)}
  .tb-pill{font-family:var(--mono);font-size:9px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);color:var(--t3);cursor:pointer;transition:all .12s}
  .tb-pill:hover{border-color:var(--border-hi);color:var(--t2)}
  .tb-pill.online{border-color:rgba(61,255,160,.3);color:var(--green)}
  .main{flex:1;display:flex;overflow:hidden}
  .module-container{flex:1;display:flex;overflow:hidden;position:relative}
  .module-view{flex:1;display:none;flex-direction:column;overflow-y:auto;padding:20px 24px}
  .module-view.active{display:flex}
  .sidebar{width:240px;flex-shrink:0;background:var(--bg-surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;padding:12px}
  .sidebar.collapsed{width:0;padding:0;overflow:hidden}
  .sb-label{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
  .sb-item{padding:6px 8px;border-radius:4px;font-size:12px;color:var(--t2);cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:6px}
  .sb-item:hover{background:var(--bg-raised)}
  .sb-item .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
  .sb-section{margin-bottom:16px}
  .hdr{margin-bottom:20px}
  .hdr-title{font-family:var(--cond);font-weight:700;font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--t1)}
  .hdr-sub{font-size:12px;color:var(--t3);margin-top:4px}
  .card{background:var(--bg-raised);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
  .card-title{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
  .card-sm{background:var(--bg-raised);border:1px solid var(--border);border-radius:6px;padding:12px}
  .btn{padding:7px 16px;border-radius:5px;border:1px solid var(--border);font-family:var(--cond);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .12s;background:var(--bg-surface);color:var(--t2)}
  .btn:hover{border-color:var(--border-hi);color:var(--t1)}
  .btn-blue{background:rgba(74,158,255,.12);border-color:rgba(74,158,255,.35);color:var(--blue)}
  .btn-blue:hover{background:rgba(74,158,255,.2)}
  .btn-amber{background:rgba(255,184,48,.1);border-color:rgba(255,184,48,.3);color:var(--amber)}
  .btn-amber:hover{background:rgba(255,184,48,.18)}
  .btn-green{background:rgba(61,255,160,.1);border-color:rgba(61,255,160,.3);color:var(--green)}
  .btn-green:hover{background:rgba(61,255,160,.18)}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .col{flex:1;min-width:280px}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;font-family:var(--mono);font-size:9px;background:var(--bg-surface);border:1px solid var(--border);color:var(--t2)}
  .tag-blue{border-color:rgba(74,158,255,.3);color:var(--blue);background:rgba(74,158,255,.08)}
  .tag-green{border-color:rgba(61,255,160,.2);color:var(--green);background:rgba(61,255,160,.06)}
  .tag-amber{border-color:rgba(255,184,48,.3);color:var(--amber);background:rgba(255,184,48,.08)}
  .stage-bar{display:flex;gap:4px;padding:12px 0}
  .stage{flex:1;padding:8px;border-radius:5px;text-align:center;font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--border);color:var(--t3);background:var(--bg-surface)}
  .stage.done{background:rgba(61,255,160,.08);border-color:rgba(61,255,160,.25);color:var(--green)}
  .stage.active{background:rgba(74,158,255,.1);border-color:rgba(74,158,255,.3);color:var(--blue)}
  .stage.wait{background:var(--bg-surface);border-color:var(--border);color:var(--t3)}
  .fs-list{display:flex;flex-direction:column;gap:4px}
  .fs-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;font-size:12px;font-family:var(--mono);color:var(--t2);background:var(--bg-surface);border-left:2px solid var(--border)}
  .fs-item.source{border-left-color:var(--amber)}
  .fs-item.extract{border-left-color:var(--blue)}
  .fs-item.research{border-left-color:var(--purple)}
  .fs-item.design{border-left-color:var(--cyan)}
  .fs-item.build{border-left-color:var(--green)}
  .fs-item .arrow{color:var(--t3);font-size:10px;margin:0 4px}
  .pl-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;background:var(--bg-surface);border:1px solid var(--border);cursor:pointer;transition:all .12s;margin-bottom:4px}
  .pl-item:hover{border-color:var(--border-hi)}
  .pl-icon{font-size:16px;width:24px;text-align:center}
  .pl-info{flex:1}
  .pl-title{font-family:var(--cond);font-weight:600;font-size:13px;color:var(--t1)}
  .pl-meta{font-family:var(--mono);font-size:9px;color:var(--t3);margin-top:2px}
  .pl-status{font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:10px}
  .pl-status.active{background:rgba(61,255,160,.1);color:var(--green)}
  .statusbar{height:22px;background:var(--bg-surface);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:16px;flex-shrink:0}
  .sb{font-family:var(--mono);font-size:9px;color:var(--t3);display:flex;align-items:center;gap:4px}
  .sb .dg{width:4px;height:4px;border-radius:50%;background:var(--green)}
  .sb .da{width:4px;height:4px;border-radius:50%;background:var(--amber)}
  .sb-sep{color:var(--border)}
  @media(max-width:800px){.sidebar{display:none}.row{flex-direction:column}}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-logo">CIS █</div>
  <div class="tb-nav" id="topnav">
    <button class="active" data-mod="ideas">Ideas</button>
    <button data-mod="project">Project</button>
    <button data-mod="files">Files</button>
    <button data-mod="research">Research</button>
    <button data-mod="knowledge">Knowledge</button>
    <button data-mod="agents">Agents</button>
  </div>
  <div class="tb-right">
    <span class="tb-pill online">● kernel</span>
    <span class="tb-pill">v0.2</span>
  </div>
</div>

<div class="main">
  <div class="module-container" id="module-container">
    <!-- modules loaded dynamically -->
  </div>
  <div class="sidebar" id="sidebar">
    <div class="sb-section">
      <div class="sb-label">Active Project</div>
      <div class="sb-item" style="background:var(--bg-raised)"><span class="dot" style="background:var(--green)"></span>CIS Kernel v1</div>
    </div>
    <div class="sb-section">
      <div class="sb-label">Stage</div>
      <div style="display:flex;flex-direction:column;gap:3px;padding:4px 8px">
        <span style="font-family:var(--mono);font-size:9px;color:var(--green)">● source — intaking</span>
        <span style="font-family:var(--mono);font-size:9px;color:var(--t3)">○ extraction — pending</span>
        <span style="font-family:var(--mono);font-size:9px;color:var(--t3)">○ research — pending</span>
        <span style="font-family:var(--mono);font-size:9px;color:var(--t3)">○ design — pending</span>
        <span style="font-family:var(--mono);font-size:9px;color:var(--t3)">○ build — pending</span>
      </div>
    </div>
    <div class="sb-section">
      <div class="sb-label">Knowledge Base</div>
      <div class="sb-item"><span class="dot" style="background:var(--amber)"></span>0 indexed records</div>
      <div class="sb-item"><span class="dot" style="background:var(--t3)"></span>518 source files</div>
      <div class="sb-item"><span class="dot" style="background:var(--blue)"></span>1 session captured</div>
    </div>
  </div>
</div>

<div class="statusbar">
  <span class="sb"><span class="dg"></span>CIS Kernel</span>
  <span class="sb-sep">|</span>
  <span class="sb">0 active agents</span>
  <span class="sb-sep">|</span>
  <span class="sb">518 source files</span>
  <span class="sb-sep">|</span>
  <span class="sb">0 KB indexed</span>
</div>

<script>
// Module loader — fetches .html components from /ui_components/ and injects them
const MODULES = ['ideas','project','files','research','knowledge','agents']

function switchModule(name) {
  document.querySelectorAll('.tb-nav button').forEach(b => b.classList.remove('active'))
  document.querySelector(`.tb-nav button[data-mod="${name}"]`).classList.add('active')
  document.querySelectorAll('.module-view').forEach(v => v.classList.remove('active'))
  const el = document.getElementById('mod-'+name)
  if (el) { el.classList.add('active'); return }
  // Lazy load
  const container = document.getElementById('module-container')
  const div = document.createElement('div')
  div.className = 'module-view active'
  div.id = 'mod-'+name
  div.innerHTML = '<div style="text-align:center;padding:40px;color:var(--t3)"><div style="font-size:24px;margin-bottom:8px">⏳</div><p>Loading '+name+' module...</p></div>'
  container.appendChild(div)
  fetch('/kernel/components/mod_'+name+'.html')
    .then(r => r.text())
    .then(html => { div.innerHTML = html })
    .catch(() => { div.innerHTML = '<div class="hdr"><div class="hdr-title">'+name.toUpperCase()+'</div><div class="hdr-sub">Module not loaded yet</div></div><div class="card"><p style="color:var(--t3);font-size:12px">Create <code>ui_components/mod_'+name+'.html</code> to add content here.</p></div>' })
}

document.querySelectorAll('.tb-nav button').forEach(b => {
  b.addEventListener('click', () => switchModule(b.dataset.mod))
})

// Init with ideas module inline
document.addEventListener('DOMContentLoaded', () => {
  const c = document.getElementById('module-container')
  c.innerHTML = `
<div class="module-view active" id="mod-ideas">
  <div class="hdr"><div class="hdr-title">Idea Ingestion</div><div class="hdr-sub">Capture an idea. Any idea. No domain required.</div></div>
  <div class="row">
    <div class="col">
      <div class="card">
        <div class="card-title">Quick Capture</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <input id="idea-title" class="btn" type="text" placeholder="Working title..." style="width:100%;padding:10px;text-align:left;text-transform:none;letter-spacing:0;font-size:14px;font-family:var(--sans);background:var(--bg-surface)">
          <textarea id="idea-concept" placeholder="What's the concept?" style="width:100%;padding:10px;border-radius:5px;border:1px solid var(--border);background:var(--bg-surface);color:var(--t1);font-family:var(--sans);font-size:13px;min-height:80px;resize:vertical;outline:0"></textarea>
          <input id="idea-tags" class="btn" type="text" placeholder="Tags (optional)" style="width:100%;padding:10px;text-align:left;text-transform:none;letter-spacing:0;font-size:14px;font-family:var(--sans);background:var(--bg-surface)">
          <div style="display:flex;gap:8px">
            <button class="btn btn-blue" onclick="captureIdea()">+ Capture</button>
            <button class="btn btn-amber" onclick="switchModule('files')">📂 Browse Source</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Bulk Intake</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn">📁 Folder</button>
          <button class="btn">📄 Files</button>
          <button class="btn">📋 Paste</button>
          <span style="font-family:var(--mono);font-size:9px;color:var(--t3);align-self:center">.md .txt .pdf .png .jpg .mp4 .wav</span>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card">
        <div class="card-title">Knowledge Base</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div class="pl-item"><span class="pl-icon">📚</span><div class="pl-info"><div class="pl-title">Total indexed records</div><div class="pl-meta">0 — nothing extracted yet</div></div></div>
          <div class="pl-item"><span class="pl-icon">📝</span><div class="pl-info"><div class="pl-title">Session captures</div><div class="pl-meta">1 — this session</div></div></div>
          <div class="pl-item"><span class="pl-icon">📂</span><div class="pl-info"><div class="pl-title">Source files registered</div><div class="pl-meta">518 files across 13 categories</div></div></div>
        </div>
        <div style="margin-top:10px">
          <button class="btn btn-green" style="width:100%" onclick="switchModule('knowledge')">🔍 Search Knowledge Base</button>
        </div>
      </div>
    </div>
  </div>
</div>`
})

function captureIdea() {
  const t = document.getElementById('idea-title').value.trim()
  if (!t) { alert('A title is all you need.'); return }
  document.getElementById('idea-title').value = ''
  document.getElementById('idea-concept').value = ''
  document.getElementById('idea-tags').value = ''
  alert('Captured: '+t+'\n\n(Not yet wired to backend — would create project and write to filesystem)')
}
</script>
</body>
</html>
